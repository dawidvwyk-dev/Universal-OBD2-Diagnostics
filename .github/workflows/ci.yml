name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: dart analyze --fatal-infos packages app
      - name: Test core packages
        run: |
          for p in obd_decoders obd_protocols obd_engine; do
            (cd packages/$p && dart test)
          done
      - name: Test app
        working-directory: app
        run: flutter test

  windows:
    name: Windows build (.exe)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: obd2-diagnostics-windows-x64
          path: app/build/windows/x64/runner/Release/

  android:
    name: Android build (APK and AAB)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - name: Build App Bundle
        working-directory: app
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: obd2-diagnostics-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
