name: obd_workspace
publish_to: none
environment:
  sdk: ^3.6.0
workspace:
  - app
  - packages/obd_decoders
  - packages/obd_protocols
  - packages/obd_transport
  - packages/obd_engine
  - packages/obd_sim
  - packages/diag_store
dev_dependencies:
  lints: ^6.0.0

# SQLite3MultipleCiphers gives an encrypted database on Windows and Android.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
